services:
  db:
    image: postgres:16
    restart: unless-stopped
    container_name: controle-financeiro-db
    environment:
      POSTGRES_DB: controle_financeiro
      POSTGRES_USER: financeiro
      POSTGRES_PASSWORD: financeiro
    ports:
      - "5432:5432"
    volumes:
      - dados-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeiro -d controle_financeiro"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: controle-financeiro-api
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/controle_financeiro
      DB_USERNAME: financeiro
      DB_PASSWORD: financeiro
    depends_on:
      db:
        condition: service_healthy

volumes:
  dados-postgres: