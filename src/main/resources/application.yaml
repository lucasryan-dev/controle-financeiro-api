spring:
  application:
    name: controle-financeiro
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/controle_financeiro}
    username: ${DB_USERNAME:financeiro}
    password: ${DB_PASSWORD:financeiro}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true